name: Superalliance CDK

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "app/**"
      - "cdk/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/superalliance-deploy.yml"
  pull_request:
    paths:
      - "api/**"
      - "app/**"
      - "cdk/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/superalliance-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-2
  CI: "false"
  VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test API
        run: npm run test -w api

      - name: Test CDK
        run: npm run cdk:test

      - name: Build frontend
        run: npm run build -w app

      - name: Type-check CDK
        run: npm run cdk:build

      - name: Synthesize stacks
        run: npm run cdk:synth

  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate deployment secrets
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          TBA_KEY: ${{ secrets.TBA_KEY }}
        run: |
          test -n "$VITE_CLERK_PUBLISHABLE_KEY" || { echo "::error::VITE_CLERK_PUBLISHABLE_KEY is required"; exit 1; }
          test -n "$MONGODB_URI" || { echo "::error::MONGODB_URI is required"; exit 1; }
          test -n "$CLERK_PUBLISHABLE_KEY" || { echo "::error::CLERK_PUBLISHABLE_KEY is required"; exit 1; }
          test -n "$CLERK_SECRET_KEY" || { echo "::error::CLERK_SECRET_KEY is required"; exit 1; }
          test -n "$TBA_KEY" || { echo "::error::TBA_KEY is required"; exit 1; }

      - name: Build frontend
        run: npm run build -w app

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::738044534240:role/superalliance-api-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Superalliance stacks
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          TBA_KEY: ${{ secrets.TBA_KEY }}
        run: |
          npx cdk deploy --all --require-approval never \
            --parameters "superalliance-backend:MongoDbUri=$MONGODB_URI" \
            --parameters "superalliance-backend:ClerkPublishableKey=$CLERK_PUBLISHABLE_KEY" \
            --parameters "superalliance-backend:ClerkSecretKey=$CLERK_SECRET_KEY" \
            --parameters "superalliance-backend:TbaKey=$TBA_KEY"
        working-directory: cdk
